name: Daily Groww Analytics Pipeline

on:
  schedule:
    # Runs at 10:15 UTC (3:45 PM IST) Monday-Friday, right after NSE/BSE market close
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-backtest-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Python Engine
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install websockets

      - name: Run Dispersion & HFT Engine
        env:
          GROWW_API_KEY: ${{ secrets.GROWW_API_KEY }}
          GROWW_API_SECRET: ${{ secrets.GROWW_API_SECRET }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
        run: |
          # Run the two main generator scripts
          python run_dispersion_backtest.py
          python run_real_backtest.py
          
          # Ensure results folder exists and files were generated
          ls -la results/

      - name: Checkout Lovable UI Repository
        uses: actions/checkout@v4
        with:
          repository: Ojusstalwar/HFT-Backtest
          token: ${{ secrets.PAT_TOKEN }}
          path: HFT-Backtest

      - name: Push Data to Lovable UI Repo
        run: |
          # Copy the newly generated JSON reports into the UI repo
          cp results/dispersion_report.json HFT-Backtest/src/data/
          cp results/backtest_report.json HFT-Backtest/src/data/
          
          cd HFT-Backtest
          
          # Configure Git
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Check for changes
          if git diff --quiet; then
            echo "No data changes detected. Skipping push."
          else
            git add src/data/*.json
            git commit -m "chore: daily groww market data update"
            git push origin main
            echo "Successfully pushed new data to UI repo! Vercel build triggered."
          fi
